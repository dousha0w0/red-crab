# Fork-only check (never in the PR): the macOS tests on three runners, then what each does with nice, a synthetic
# scroll and a status-item click.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: NumPy, Pillow, PyObjC and pytest
        run: python -m pip install -r requirements.txt -r requirements-mac.txt pytest==9.2.0

      - name: Tests
        continue-on-error: true
        run: python -m pytest clawd_mac/tests -q --ignore=clawd_mac/tests/test_zz_ci_diag.py -p no:cacheprovider

      - name: Diagnostics
        run: python -m pytest clawd_mac/tests/test_zz_ci_diag.py -q -s -p no:cacheprovider
